<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CivicFlow Sign Up</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #bde7f3;
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .signup-box {
      background-color: #e3f2fd;
      color: #1e3c72;
      padding: 3rem;
      border-radius: 16px;
      width: 420px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      text-align: center;
    }
    .signup-box h2 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: #ff6600;
    }
    .signup-box p {
      font-size: 1rem;
      margin-bottom: 2rem;
      color: #1e3c72;
    }
    .signup-box input, .signup-box select {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      background-color: #ffffff;
    }
    .signup-box input:focus, .signup-box select:focus {
      border-color: #ff6600;
      box-shadow: 0 0 6px rgba(255,102,0,0.3);
      outline: none;
    }
    .signup-box button {
      width: 100%;
      padding: 12px;
      margin-top: 16px;
      border: none;
      border-radius: 8px;
      background-color: #ff6600;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }
    .signup-box button:hover {
      background-color: #e65c00;
      transform: scale(1.03);
    }
    .switch-link {
      margin-top: 1rem;
      font-size: 0.9rem;
    }
    .switch-link a {
      color: #ff6600;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="signup-box">
    <h2>📝 CivicFlow</h2>
    <p>Create Your Account</p>
    <input type="text" id="name" placeholder="Enter Full Name" required>
    <input type="email" id="email" placeholder="Enter Email" required>
    <input type="password" id="password" placeholder="Enter Password" required>
    
    <!-- Optional role selection -->
    <select id="role">
      <option value="citizen">Citizen</option>
      <option value="officer">Officer</option>
      <option value="admin">Admin</option>
    </select>
    
    <button onclick="signup()">Sign Up</button>
    <!-- Link back to Login -->
    <div class="switch-link">Already have an account? <a href="LogIn_page.html">Login</a></div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>

  <script>
    // Replace with your Firebase config
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
    };

    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    async function signup() {
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const role = document.getElementById("role").value;

      if (!name || !email || !password) {
        alert("Please fill all fields.");
        return;
      }

      try {
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        const user = userCredential.user;

        // Save user details in Firestore
        await db.collection("users").doc(user.uid).set({
          name: name,
          email: email,
          role: role
        });

        alert("Signup successful! You can now login.");
        window.location.href = "LogIn_page.html"; // redirect to login
      } catch (error) {
        alert("Signup failed: " + error.message);
      }
    }
  </script>
</body>
</html>
