<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CivicFlow Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; background: #bde7f3; height: 100vh; margin: 0; display: flex; justify-content: center; align-items: center; }
    .box { background: #e3f2fd; padding: 3rem; border-radius: 16px; width: 420px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
    h2 { color: #ff6600; }
    input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #ff6600; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    button:hover { background: #e65c00; }
  </style>
</head>

<body>
<div class="box">
  <h2>🔑 CivicFlow</h2>
  <p>Login</p>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">

  <button onclick="login()">Login</button>

<script>
  function login() {
    // Redirect to your Citizen page folder
    window.location.href = "../citizen/index.html";  
    // 👆 Adjust the path depending on your folder structure
  }
</script>



  <p>Create Account
  <a href="../SignIn_Page/index.html">Sign In</a>
</p>
</div>

<!-- ✅ UPDATED SCRIPT -->
<script type="module">
  // 🔹 Import auth & db from centralized firebase.js
  import { auth, db } from "../firebase.js"; // adjust path if needed

  // 🔹 Import required Firebase functions
  import { signInWithEmailAndPassword } from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  import { doc, getDoc } from
    "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  window.login = async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      alert("Please fill all fields");
      return;
    }

    try {
      const userCred = await signInWithEmailAndPassword(auth, email, password);

      // 🔍 Fetch user role from Firestore
      const userRef = doc(db, "users", userCred.user.uid);
      const snap = await getDoc(userRef);

      if (!snap.exists()) {
        alert("User profile not found. Contact admin.");
        return;
      }

      const userData = snap.data();
      alert("Welcome " + userData.name);

      // 🚀 Role-based routing
      if (userData.role === "admin") {
        window.location.href = "../Admin_Dashboard/index.html";
      } else if (userData.role === "officer") {
        window.location.href = "../Officer_Dashboard/index.html";
      } else {
        window.location.href = "../Citizen_Dashboard/index.html";
      }

    } catch (err) {
      alert(err.message);
    }
  };
</script>
</body>
</html>
