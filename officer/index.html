<!DOCTYPE html>
<html>
<head>
    <title>Officer Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #e8f5e9, #f1f8ff);
            margin: 0;
        }

        .container {
            max-width: 1100px;      
            margin: 40px auto;       
            background-color: #fff; 
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        .header {
            background-color: #1b5e20;
            color: white;
            padding: 20px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            border-radius: 8px 8px 0 0;
        }

        h3 {
            margin-bottom: 20px;
            color: #1b5e20;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            margin: 0 auto;
        }

        th {
            background-color: #e3f2fd;
            color: #0d47a1;
        }

        th, td {
            padding: 15px;
            text-align: left;
        }

        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #f1f8e9; }

        .status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            color: white;
        }

        .pending { background-color: #ff9800; }
        .progress { background-color: #4caf50; }
        .nearsla { background-color: #f44336; }

        button {
            padding: 8px 14px;
            background-color: #1976d2;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { background-color: #0d47a1; }

        @media (max-width: 768px) {
            .container { width: 95%; padding: 20px; }
            th, td { padding: 10px; font-size: 13px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">Officer Dashboard</div>

    <h3>Assigned Grievances</h3>

    <table>
        <tr>
            <th>ID</th>
            <th>Category</th>
            <th>Area</th>
            <th>Location</th>
            <th>Status</th>
            <th>Action</th>
        </tr>

        <tr>
            <td>GRV1001</td>
            <td>Road Damage</td>
            <td>Dharampeth</td>
            <td>Nagpur - 440010</td>
            <td><span class="status pending">Pending</span></td>
            <td><button onclick="goToUpdate('GRV1001')">Update</button></td>
        </tr>

        <tr>
            <td>GRV1002</td>
            <td>Water Supply</td>
            <td>Sadar</td>
            <td>Nagpur - 440001</td>
            <td><span class="status progress">In Progress</span></td>
            <td><button onclick="goToUpdate('GRV1002')">Update</button></td>
        </tr>

        <tr>
            <td>GRV1003</td>
            <td>Street Light</td>
            <td>Trimurti Nagar</td>
            <td>Nagpur - 440022</td>
            <td><span class="status nearsla">Near SLA</span></td>
            <td><button onclick="goToUpdate('GRV1003')">Update</button></td>
        </tr>
    </table>
</div>

<script>
    function goToUpdate(id) {
        window.location.href = "update.html?id=" + id;
    }
</script>

</body>
</html>
