<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Officer Dashboard</title>
<style>
body {
    font-family: Arial;
    background: linear-gradient(to right, #e8f5e9, #f1f8ff);
    margin: 0;
    padding: 30px;
}
.container {
    max-width: 1100px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 6px 12px rgba(0,0,0,0.1);
}
.header {
    background: #1b5e20;
    color: white;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
}
table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 30px;
}
th, td {
    padding: 15px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}
th {
    background: #e3f2fd;
    color: #0d47a1;
}
.status {
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    color: white;
}
.assigned { background: orange; }
.progress { background: green; }
.done { background: blue; }
.bottom-buttons {
    margin-top: 30px;
    display: flex;
    justify-content: flex-start;
    gap: 15px;
}
.bottom-buttons button {
    padding: 10px 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    color: white;
}
.back-btn { background: #6c757d; }
.logout-btn { background: #d32f2f; }
.back-btn:hover { background: #5a6268; }
.logout-btn:hover { background: #9a0007; }
button.update-btn {
    padding: 6px 12px;
    background: #1976d2;
    border-radius: 6px;
    color: white;
    cursor: pointer;
}
button.update-btn:hover { background: #0d47a1; }
</style>
</head>
<body>

<div class="container">
    <div class="header"><h2>Officer Dashboard</h2></div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Category</th>
                <th>Area</th>
                <th>Status</th>
                <th>Update</th>
            </tr>
        </thead>
        <tbody id="complaintsTable"></tbody>
    </table>

    <div class="bottom-buttons">
        <button class="back-btn" onclick="goBack()">Back</button>
        <button class="logout-btn" onclick="logoutUser()">Logout</button>
    </div>
</div>

<script type="module">
import { auth, db } from "./firebase.js";
import { collection, query, where, onSnapshot, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const tableBody = document.getElementById("complaintsTable");

onAuthStateChanged(auth, async (user) => {
    // If user is not logged in
    if (!user) {
        // Only redirect if not already on SignIn page
        if (!window.location.pathname.includes("SignIn_Page")) {
            window.location.href = "../SignIn_Page/index.html";
        }
        return;
    }

    // Fetch user role
    const userDoc = await getDoc(doc(db, "users", user.uid));
    if (!userDoc.exists() || userDoc.data().role !== "officer") {
        alert("Unauthorized access!");
        window.location.href = "../LogIn_Page/index.html";
        return;
    }

    const officerDept = userDoc.data().department || "General Dept";
    const q = query(collection(db, "complaints"), where("department", "==", officerDept));

    onSnapshot(q, (snapshot) => {
        tableBody.innerHTML = "";
        snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            const id = docSnap.id;

            let statusClass =
                data.status === "In Progress" ? "progress" :
                data.status === "Done" ? "done" : "assigned";

            tableBody.innerHTML += `
                <tr>
                    <td>${id}</td>
                    <td>${data.category}</td>
                    <td>${data.area}</td>
                    <td><span class="status ${statusClass}">${data.status}</span></td>
                    <td><button class="update-btn" onclick="goToUpdate('${id}')">Update</button></td>
                </tr>
            `;
        });
    });
});


window.goToUpdate = (id) => { window.location.href = `officerUpdate.html?id=${id}`; };
window.goBack = () => { window.history.back(); };
window.logoutUser = async () => {
    await signOut(auth);
    window.location.href = "login.html";
};
</script>
</body>
</html>
